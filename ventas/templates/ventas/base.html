<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BackendU2{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            padding: 0.625rem 0.875rem;
            color: #f8fafc;
            outline: none;
            margin-top: 0.25rem;
            margin-bottom: 1rem;
        }
        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 1px #3b82f6;
        }
        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #cbd5e1;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-10 px-4 sm:px-6 lg:px-8">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Navbar / Encabezado -->
        <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between border-b border-slate-700 pb-5 gap-4">
            <div>
                <a href="{% url 'ventas:listar_productos' %}" class="text-3xl font-bold tracking-tight text-white hover:text-blue-400 transition">Inventario BackendU2</a>
                <p class="text-sm text-slate-400 mt-1">Panel de gestión y catálogo</p>
            </div>
            <div class="flex items-center gap-3">
                <a href="/admin/" class="px-4 py-2 text-sm font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 transition">Panel Admin</a>
                <a href="{% url 'ventas:crear_producto' %}" class="px-4 py-2 text-sm font-medium rounded-lg bg-blue-600 hover:bg-blue-500 text-white transition shadow-sm">+ Nuevo Producto</a>
            </div>
        </header>

        <!-- Mensajes de Feedback -->
        {% if messages %}
            <div class="space-y-2">
                {% for message in messages %}
                    <div class="p-4 rounded-lg bg-emerald-950 border border-emerald-500/50 text-emerald-300 text-sm flex items-center justify-between">
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <!-- Contenido principal -->
        <main>
            {% block content %}
            {% endblock %}
        </main>
    </div>
</body>
</html>
