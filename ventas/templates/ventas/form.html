{% extends 'ventas/base.html' %}

{% block title %}Formulario Producto | BackendU2{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <div class="flex items-center justify-between border-b border-slate-700 pb-4">
        <div>
            <h2 class="text-2xl font-bold text-white">{% if object %}Editar Producto{% else %}Nuevo Producto{% endif %}</h2>
            <p class="text-sm text-slate-400">Completa los campos del formulario</p>
        </div>
        <a href="{% url 'ventas:listar_productos' %}" class="text-sm text-blue-400 hover:text-blue-300 font-medium">&laquo; Volver al Catálogo</a>
    </div>

    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-lg">
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="pt-4 flex items-center justify-end gap-3 border-t border-slate-700">
                <a href="{% url 'ventas:listar_productos' %}" class="px-4 py-2 text-sm font-medium rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 transition">Cancelar</a>
                <button type="submit" class="px-5 py-2 text-sm font-medium rounded-lg bg-blue-600 hover:bg-blue-500 text-white transition shadow-sm">Guardar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
